<!DOCTYPE html>

<title>That page moved — Baxstar Outdoors</title>
<!-- Old addresses from the previous (Wix) site land here. GitHub Pages serves this file for any address that
     no longer exists. It sends the visitor to the matching part of the one-page site, and still answers
     "not found" to Google so the old links drop out of search. Keep this file at the repo root. -->
<script>
(function(){
  var p = (location.pathname + location.search).toLowerCase();
  var map = [
    [/bachelor/, '#bachelorette'],
    [/tour|cruise|charter|party/, '#cruises'],
    [/rate|pric|cost/, '#rates'],
    [/faq|question|polic/, '#faq'],
    [/contact|call|email/, '#contact'],
    [/about|team|owner/, '#about'],
    [/how|deliver/, '#how'],
    [/pontoon|boat|rental|sylvan|fleet/, '#pontoon']
  ];
  var hash = '';
  for (var i = 0; i < map.length; i++) { if (map[i][0].test(p)) { hash = map[i][1]; break; } }
  window.__dest = 'https://baxstaroutdoors.com/' + hash;
  location.replace(window.__dest);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://baxstaroutdoors.com/"></noscript>
